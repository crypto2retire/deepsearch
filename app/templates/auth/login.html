{% extends "base.html" %}
{% block title %}Sign In — DeepSearch{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900">DeepSearch</h1>
      <p class="text-gray-500 mt-2">Multi-agent deep research</p>
    </div>
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
      <h2 class="text-xl font-semibold mb-6">Sign in</h2>
      {% if error %}<div class="bg-red-50 text-red-700 px-4 py-3 rounded-lg mb-4 text-sm">{{ error }}</div>{% endif %}
      <form method="post" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" name="email" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input type="password" name="password" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg transition">Sign in</button>
      </form>
      <p class="text-center text-sm text-gray-500 mt-6">No account? <a href="/register" class="text-blue-600 hover:underline">Register</a></p>
    </div>
  </div>
</div>
{% endblock %}
