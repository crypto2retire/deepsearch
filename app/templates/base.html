<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}DeepSearch{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .prose pre { background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; overflow-x: auto; }
    .prose code { background: #f6f8fa; padding: 2px 6px; border-radius: 4px; font-size: 85%; }
    .prose pre code { background: transparent; padding: 0; }
    .prose blockquote { border-left: 4px solid #d0d7de; padding-left: 16px; color: #57606a; }
    .prose h1,.prose h2,.prose h3 { font-weight: 600; margin-top: 24px; }
    .prose ul { list-style: disc; padding-left: 24px; }
    .prose ol { list-style: decimal; padding-left: 24px; }
    .agent-researcher { border-left: 3px solid #3b82f6; }
    .agent-synthesizer { border-left: 3px solid #10b981; }
    .agent-planner { border-left: 3px solid #f59e0b; }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .thinking-dots::after { content: ''; animation: dots 1.5s steps(4, end) infinite; }
    @keyframes dots { 0%,20% { content: ''; } 40% { content: '.'; } 60% { content: '..'; } 80%,100% { content: '...'; } }
  </style>
</head>
<body class="h-full bg-gray-50">
  {% block body %}{% endblock %}
</body>
</html>
