[build]
  dockerfilePath = "Dockerfile"

[deploy]
  numReplicas = 1
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3

[[deploy.healthCheck]]
  path = "/health/ready"
  periodSeconds = 30
  timeoutSeconds = 10
  startupTimeoutSeconds = 60

[deploy.startCommand]
  value = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
