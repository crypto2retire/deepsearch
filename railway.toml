[build]
  dockerfilePath = "Dockerfile"

[deploy]
  numReplicas = 1
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3
  startCommand = "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"

[[deploy.healthCheck]]
  path = "/health"
  periodSeconds = 30
  timeoutSeconds = 10
  startupTimeoutSeconds = 60
